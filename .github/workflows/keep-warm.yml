name: keep-warm

# Two different kinds of sleep, both on free tiers:
#
# Render spins a service down after ~15 min of inactivity, so the first request
# after idle eats a cold start (~20-50s) and can fail outright.
#
# Supabase pauses a project after a stretch with no database activity, and a
# paused project stops resolving in DNS. That is what takes the site down: the
# Next.js middleware calls Supabase on every request, so an unreachable project
# turns every page — the public landing included — into a timeout.
#
# The Supabase ping has to reach Postgres. Hitting /auth/v1/health does not
# count as database activity; calling the shared-analysis function does, and it
# is already granted to anon, so no privileged credential is involved.

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs under load, so the
    # effective interval can stretch — fine, it just needs to land inside
    # Render's ~15 min idle window most of the time.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Render services
        run: |
          for url in \
            "https://papyrus-gateway.onrender.com/health" \
            "https://papyrus-94mv.onrender.com/health"; do
            echo "Pinging $url"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url" || echo "000")
            echo "  -> $code"
          done

      - name: Keep the Supabase project awake
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY are not set; skipping."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 0
          fi

          # Returns an empty array: no analysis is shared under this token. The
          # point is that Postgres ran the query.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_shared_analysis" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"token":"keep-warm-probe"}' || echo "000")
          echo "Supabase -> $code"

          case "$code" in
            2*) ;;
            *) echo "::warning::Supabase answered $code; the project may be paused." ;;
          esac
