services:
  ai-service:
    build:
      context: ./ai-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-45}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_CV_CHARS: ${MAX_CV_CHARS:-20000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: ./gateway
    environment:
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-20}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-168}
      CACHE_LOCAL_ENTRIES: ${CACHE_LOCAL_ENTRIES:-256}
      DATABASE_URL: ${DATABASE_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1}
      RUN_WORKER: ${RUN_WORKER:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-24}
      DLQ_RETENTION_HOURS: ${DLQ_RETENTION_HOURS:-168}
    ports:
      - "8080:8080"
    depends_on:
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # GET (not --spider/HEAD): the gateway only registers GET on /health.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8080}
        NEXT_PUBLIC_AI_SERVICE_URL: ${NEXT_PUBLIC_AI_SERVICE_URL:-}
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    # Bounded on purpose: a cache with no ceiling is a memory leak with good
    # manners. LRU eviction keeps the entries that are actually being reused.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data

  # ── Observability ────────────────────────────────────────────────────────────
  # Behind a profile so the everyday `docker compose up` still starts three
  # containers:
  #
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318   #     docker compose --profile observability up --build
  #
  # The endpoint is passed rather than defaulted: it is what switches tracing on,
  # and a default pointing at Tempo would make every ordinary `docker compose up`
  # — which has no Tempo in it — retry a connection nothing is going to answer.
  #
  # Grafana is on :3001, Prometheus on :9090, Tempo's query API on :3200.
  tempo:
    image: grafana/tempo:2.7.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./ops/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      # The OTLP endpoint both services export to. Published so a service run
      # outside compose — a `go run` while debugging — can reach it too.
      - "4318:4318"
      # The query API. Grafana reaches it over the compose network either way;
      # this is for asking Tempo things with curl.
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Tempo turns spans into RED metrics and writes them here, which needs the
      # receiving end switched on explicitly.
      - --web.enable-remote-write-receiver
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [observability]
    environment:
      # Local only: skipping the login form keeps the dashboard one click away.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo

  # ── Two replicas ─────────────────────────────────────────────────────────────
  # The point of a shared rate limiter is only visible with more than one
  # process. Two gateways behind a load balancer share one Redis, so a caller's
  # budget is the configured one — not twice it.
  #
  #   docker compose --profile scale up --build
  #   for i in $(seq 1 30); do curl -s -o /dev/null -w "%{http_code} "   #     -H "Authorization: Bearer <token>" -X POST localhost:8082/analyze; done
  #
  # Expect 200s up to the budget and 429s after, however the requests are
  # spread between the two. Stop Redis mid-run and the log says
  # "rate limiting degraded to this process only" — the budget doubles, because
  # each replica is now counting alone, and nothing fails.
  gateway-a: &scaled-gateway
    build:
      context: ./gateway
    profiles: [scale]
    environment:
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_RPM: ${SCALE_RATE_LIMIT_RPM:-10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy

  gateway-b:
    <<: *scaled-gateway

  balancer:
    image: caddy:2.9-alpine
    profiles: [scale]
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8080
      - --to
      - gateway-a:8080
      - --to
      - gateway-b:8080
    ports:
      - "8082:8080"
    depends_on:
      - gateway-a
      - gateway-b

  # ── Load testing ─────────────────────────────────────────────────────────────
  # A second gateway wired to a stub upstream, so a k6 run measures the gateway
  # instead of Gemini — and costs nothing. Bring it up with
  # `docker compose --profile loadtest up`.
  stub-ai:
    image: python:3.11-slim
    profiles: [loadtest]
    command: ["python", "/srv/ai_stub.py"]
    environment:
      STUB_LATENCY_MS: ${STUB_LATENCY_MS:-0}
    volumes:
      - ./load/stub/ai_stub.py:/srv/ai_stub.py:ro

  gateway-loadtest:
    build:
      context: ./gateway
    profiles: [loadtest]
    environment:
      PORT: 8080
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      AI_SERVICE_URL: http://stub-ai:8000
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Raised well past the real budget: the limiter is not what is under test.
      RATE_LIMIT_RPM: ${LOADTEST_RATE_LIMIT_RPM:-100000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
    ports:
      - "8081:8080"
    depends_on:
      - stub-ai

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  tempo-data:
